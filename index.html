<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>封面灵感收集</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-row">
        <h1 class="logo">封面灵感</h1>
      </div>
      <p class="hint-persist stamp-badge stamp-badge--quiet">本机存储 · 清缓存可能丢</p>
    </header>

    <nav class="tabs" id="tabs" aria-label="主导航">
      <button type="button" class="tab is-active" data-view="import"><span>导入</span></button>
      <button type="button" class="tab" data-view="candidates"><span>候选</span></button>
      <button type="button" class="tab" data-view="library"><span>灵感库</span></button>
      <button type="button" class="tab" data-view="export"><span>提示词</span></button>
    </nav>

    <main>
      <!-- 导入 · ★B 柔光舞台 + 微堆 + Soft Breath 波纹 -->
      <section id="view-import" class="view is-visible">
        <div class="import-stage enter" id="import-stage">
          <label class="import-hit" id="import-hit" for="file-input" aria-label="导入截图">
            <span class="import-glow" aria-hidden="true"></span>
            <span class="import-ripple" aria-hidden="true">
              <span class="import-ripple__ring"></span>
              <span class="import-ripple__ring"></span>
            </span>
            <span class="import-cluster" aria-hidden="true">
              <span class="import-fake-stack" id="import-fake-stack">
                <span class="import-fake-card import-fake-card--a"></span>
                <span class="import-fake-card import-fake-card--b"></span>
                <span class="import-fake-card import-fake-card--c"></span>
              </span>
              <span class="import-ring" aria-hidden="true">
                <span class="import-ring__bloom"></span>
                <span class="import-ring__arc"></span>
                <span class="import-hit__plus">+</span>
              </span>
            </span>
            <span class="import-hit__label">导入</span>
          </label>
          <input id="file-input" type="file" accept="image/*" multiple hidden />
          <div id="import-preview" class="import-preview is-hidden" aria-live="polite"></div>
          <div id="import-actions" class="import-actions is-hidden">
            <button type="button" id="btn-slice" class="btn primary" disabled>开始切封面</button>
            <label class="btn ghost import-repick" for="file-input">换一张</label>
            <button type="button" id="btn-reset-import" class="btn ghost">清空重来</button>
          </div>
        </div>
      </section>

      <!-- 候选 -->
      <section id="view-candidates" class="view">
        <div class="cand-panel enter">
          <div class="section-head">
            <h2>封面候选</h2>
          </div>
          <p class="muted" id="candidates-meta">先导入截图再切分。</p>
          <div class="row-actions cand-toolbar">
            <button type="button" id="btn-select-all" class="btn ghost" disabled>全选</button>
            <button type="button" id="btn-clear-sel" class="btn ghost" disabled>清空选择</button>
          </div>
          <div class="cand-stage" id="candidates-stage">
            <div id="candidates-rail" class="cand-rail" aria-label="封面候选轮播"></div>
          </div>
          <p id="candidates-pager" class="cand-pager is-hidden" aria-live="polite"></p>
          <button type="button" id="btn-save-selected" class="btn primary" disabled>为所选填写笔记</button>
        </div>
      </section>

      <!-- 记笔记 -->
      <section id="view-note" class="view">
        <div class="note-stage enter">
          <div class="section-head note-head">
            <h2>记笔记</h2>
            <p class="note-progress" id="note-progress"></p>
          </div>
          <div id="note-cover-preview" class="note-cover"></div>
          <form id="note-form" class="note-form">
            <label>为何想点
              <textarea id="field-why" rows="2" placeholder="标题、配色"></textarea>
            </label>
            <label>感觉
              <textarea id="field-feeling" rows="2" placeholder="清爽、安静"></textarea>
            </label>
            <label>结构亮点
              <textarea id="field-structure" rows="2" placeholder="留白、三分"></textarea>
            </label>
            <label>画面可学点
              <textarea id="field-learn" rows="2" placeholder="光影、字体"></textarea>
            </label>
            <div class="note-cat">
              <span class="note-cat__k" id="note-cat-label">分类</span>
              <div id="note-cat-chips" class="note-cat-chips" role="listbox" aria-labelledby="note-cat-label"></div>
              <div class="note-cat-add">
                <input id="field-new-cat" type="text" maxlength="20" placeholder="新分类" autocomplete="off" aria-label="新分类" />
                <button type="button" id="btn-add-cat">添加</button>
              </div>
            </div>
            <label>标签
              <input id="field-tags" type="text" placeholder="美妆, 居家" />
            </label>
            <div id="tag-preview" class="chips tag-preview" aria-live="polite"></div>
            <div class="row-actions">
              <button type="button" id="btn-note-skip" class="btn ghost">跳过这张</button>
              <button type="submit" class="btn primary">保存并下一张</button>
            </div>
          </form>
        </div>
      </section>

      <!-- 灵感库 · 近黑双列 + 底部分类条 -->
      <section id="view-library" class="view">
        <div class="lib-stage">
          <div class="section-head lib-head">
            <h2>灵感库</h2>
          </div>
          <div class="lib-scroll" id="lib-scroll">
            <div id="library-list" class="library-grid" aria-label="已保存封面"></div>
            <p id="library-empty" class="lib-empty" hidden>还没有封面</p>
          </div>
          <div class="lib-dock">
            <div id="cat-bar" class="cat-bar" role="tablist" aria-label="分类"></div>
            <button type="button" id="btn-clear-all" class="lib-clear">清空</button>
          </div>
        </div>
      </section>

      <!-- 提示词 -->
      <section id="view-export" class="view">
        <div class="export-stage enter">
          <div class="section-head">
            <h2>提示词</h2>
          </div>
          <p class="export-hint">长按截图保存</p>
          <button type="button" id="btn-build-export" class="btn primary">生成汇总</button>
          <div id="export-board" class="export-board empty">空</div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>Crayon_ · 封面灵感 · 离线</span>
    </footer>

  </div>

  <div id="lib-sheet" class="lib-sheet" hidden>
    <button type="button" id="lib-sheet-backdrop" class="lib-sheet__backdrop" aria-label="关闭"></button>
    <div class="lib-sheet__panel" id="lib-sheet-panel" role="dialog" aria-modal="true" aria-label="封面笔记">
      <div class="lib-sheet__handle" id="lib-sheet-handle" aria-hidden="true"></div>
      <button type="button" id="lib-sheet-close" class="lib-sheet__close" aria-label="关闭">×</button>
      <div class="lib-sheet__cover" id="lib-sheet-cover"></div>
      <div class="lib-sheet__fields" id="lib-sheet-fields"></div>
      <button type="button" id="lib-sheet-delete" class="lib-sheet__delete">删除</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
