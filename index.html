<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>封面灵感收集</title>
  <link rel="stylesheet" href="./styles.css?v=20261107d" />
</head>
<body>
  <nav class="tabs" id="tabs" aria-label="主导航" hidden>
    <button type="button" class="tab is-active" data-view="import"><span>导入</span></button>
    <button type="button" class="tab" data-view="library"><span>灵感库</span></button>
  </nav>
  <div id="app">
    <main>
      <!-- 导入 · ★B 柔光舞台 + 微堆 + Soft Breath 波纹 -->
      <section id="view-import" class="view is-visible">
        <div class="import-stage enter" id="import-stage">
          <h1 class="import-title">小红书封面<br />灵感库</h1>
          <div class="import-finder" aria-hidden="true">
            <span class="import-finder__tick import-finder__tick--tl"></span>
            <span class="import-finder__tick import-finder__tick--tr"></span>
            <span class="import-finder__tick import-finder__tick--bl"></span>
            <span class="import-finder__tick import-finder__tick--br"></span>
          </div>
          <p class="import-finder-hint">放入信息流截图</p>
          <label class="import-hit" id="import-hit" for="file-input" aria-label="导入截图">
            <span class="import-glow" aria-hidden="true"></span>
            <span class="import-ripple" aria-hidden="true">
              <span class="import-ripple__ring"></span>
              <span class="import-ripple__ring"></span>
            </span>
            <span class="import-cluster" aria-hidden="true">
              <span class="import-fake-stack" id="import-fake-stack">
                <span class="import-fake-card import-fake-card--a"></span>
                <span class="import-fake-card import-fake-card--b"></span>
                <span class="import-fake-card import-fake-card--c"></span>
              </span>
              <span class="import-ring" aria-hidden="true">
                <span class="import-ring__bloom"></span>
                <span class="import-ring__arc"></span>
                <span class="import-hit__plus">+</span>
              </span>
            </span>
          </label>
          <input id="file-input" type="file" accept="image/*" multiple hidden />
          <!-- 导入状态卡：加载/失败非阻塞反馈（失败含「再试一次」） -->
          <div id="import-status" class="import-status" hidden></div>
          <button type="button" id="btn-follow-author" class="follow-pill" hidden aria-label="关注作者">关注</button>
          <div id="pick-stage" class="pick-stage is-hidden">
            <div class="pick-rail-wrap">
              <div id="pick-rail" class="cand-rail" aria-label="封面"></div>
            </div>
            <p id="pick-pager" class="cand-pager is-hidden" aria-live="polite"></p>
            <div class="import-actions">
              <button type="button" id="btn-note" class="btn primary" disabled>收藏</button>
              <button type="button" id="btn-repick" class="btn ghost import-repick">换一张</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 记笔记 -->
      <section id="view-note" class="view">
        <div class="note-stage enter">
          <p class="note-progress" id="note-progress"></p>
          <div class="note-cover-wrap" id="note-cover-wrap">
            <div id="note-cover-preview" class="note-cover"></div>
            <svg class="pp-creases" id="pp-creases" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true">
              <line class="pp-crease" x1="50" y1="0" x2="50" y2="130"/>
              <line class="pp-crease" x1="0" y1="0" x2="100" y2="65"/>
              <line class="pp-crease" x1="0" y1="130" x2="100" y2="65"/>
            </svg>
            <div class="pp-stage" id="pp-stage" aria-hidden="true"></div>
          </div>
          <div class="note-scroll" id="note-scroll">
          <div id="note-type" class="note-type">
            <p class="note-type__k">封面类型</p>
            <div id="note-type-list" class="note-type__list" role="listbox" aria-label="封面类型"></div>
          </div>
          <form id="note-form" class="note-form" hidden>
            <button type="button" id="btn-type-back" class="note-type-current"></button>
            <label class="note-field">
              <span>封面主文案</span>
              <textarea id="field-headline" rows="2" placeholder="裸辞3个月，我后悔了吗"></textarea>
            </label>
            <label class="note-field">
              <span>为什么想点</span>
              <textarea id="field-why" rows="2" placeholder="数字太夸张了、感觉在说我"></textarea>
            </label>
            <label class="note-field">
              <span id="field-a-label">核心结果</span>
              <textarea id="field-a" rows="2"></textarea>
            </label>
            <label class="note-field">
              <span id="field-b-label">证据形式</span>
              <textarea id="field-b" rows="2"></textarea>
            </label>
            <label class="note-field">
              <span>补充想法</span>
              <textarea id="field-extra" rows="2" placeholder="配色、排版、元素、发布场景"></textarea>
            </label>
            <div class="note-actions">
              <button type="button" id="btn-note-skip" class="note-skip">跳过这张</button>
              <button type="submit" id="btn-note-save" class="btn primary">保存并下一张</button>
            </div>
          </form>
          <button type="button" id="btn-note-skip-type" class="note-skip note-skip--type">跳过这张</button>
          </div>
        </div>
      </section>

      <!-- 灵感库 · 分类横滑行 -->
      <section id="view-library" class="view">
        <div class="lib-stage">
          <nav class="lib-chip-bar" id="lib-chip-bar" aria-label="分类筛选">
            <button type="button" id="btn-lib-cat-add" class="lib-chip-add" aria-label="新建分类">＋</button>
          </nav>
          <button type="button" id="btn-lib-manage" class="lib-manage">管理</button>
          <div class="lib-scroll" id="lib-scroll">
            <div id="library-rows" class="lib-rows" aria-label="按分类浏览"></div>
            <p id="library-empty" class="lib-empty" hidden>空</p>
          </div>
          <div class="lib-dock">
            <button type="button" id="btn-clear-all" class="lib-clear">清空</button>
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- 全屏封面查看 · 顶栏返回 + 底部固定四钮横排（层级在 lib-sheet 之下） -->
  <div id="img-viewer" class="img-viewer" hidden>
    <header class="viewer-topbar">
      <button type="button" id="viewer-back" class="viewer-topbar__back" aria-label="返回">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12.5 4 6.5 10l6 6"/></svg>
      </button>
      <span class="viewer-topbar__title">封面预览</span>
    </header>
    <canvas id="viewer-canvas" aria-label="封面预览"></canvas>
    <nav id="viewer-bar" class="viewer-bar" aria-label="封面操作">
      <button type="button" id="viewer-like" class="viewer-bar__btn viewer-bar__btn--like" data-action="like">
        <span class="viewer-bar__icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M10 16.6S3.6 12.4 1.9 8.4C.9 6 2.4 3.4 5 3.4c1.9 0 3.4 1.1 5 3 1.6-1.9 3.1-3 5-3 2.6 0 4.1 2.6 3.1 5-1.7 4-8.1 8.2-8.1 8.2z"/></svg></span>
        <span class="viewer-bar__label">喜欢</span>
      </button>
      <button type="button" class="viewer-bar__btn" data-action="export">
        <span class="viewer-bar__icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M10 3.6v8.7M6.4 8.7 10 12.3l3.6-3.6M4.6 13v2.6a1 1 0 0 0 1 1h8.8a1 1 0 0 0 1-1V13"/></svg></span>
        <span class="viewer-bar__label">导出</span>
      </button>
      <button type="button" class="viewer-bar__btn" data-action="desc">
        <span class="viewer-bar__icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M10 1.9a8.1 8.1 0 1 0 0 16.2 8.1 8.1 0 0 0 0-16.2zM10 9.2v4.2M10 6.1v.2"/></svg></span>
        <span class="viewer-bar__label">查详情</span>
      </button>
      <button type="button" class="viewer-bar__btn viewer-bar__btn--danger" data-action="delete">
        <span class="viewer-bar__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M5 7h14M10 7V5.5A1.5 1.5 0 0 1 11.5 4h1A1.5 1.5 0 0 1 14 5.5V7m3 0l-.7 11.2A1.8 1.8 0 0 1 14.5 20h-5a1.8 1.8 0 0 1-1.8-1.8L7 7m3 4v5m4-5v5"/></svg></span>
        <span class="viewer-bar__label">删除</span>
      </button>
    </nav>
    <div id="viewer-toast" class="viewer-toast" hidden aria-live="polite"></div>
  </div>

  <div id="lib-sheet" class="lib-sheet" hidden>
    <button type="button" id="lib-sheet-backdrop" class="lib-sheet__backdrop" aria-label="关闭"></button>
    <div class="lib-sheet__panel" id="lib-sheet-panel" role="dialog" aria-modal="true" aria-label="封面笔记">
      <div class="lib-sheet__handle" id="lib-sheet-handle" aria-hidden="true"></div>
      <button type="button" id="lib-sheet-close" class="lib-sheet__close" aria-label="关闭">×</button>
      <div class="lib-sheet__cover" id="lib-sheet-cover"></div>
      <div class="lib-sheet__fields" id="lib-sheet-fields"></div>
      <button type="button" id="sheet-save" class="sheet-save" hidden>确认修改</button>
      <button type="button" id="lib-sheet-delete" class="lib-sheet__delete">删除</button>
    </div>
    <div id="sheet-confirm" class="sheet-confirm" hidden>
      <button type="button" id="sheet-confirm-backdrop" class="sheet-confirm__backdrop" aria-label="取消"></button>
      <div class="sheet-confirm__box" role="dialog" aria-modal="true" aria-label="确认修改">
        <p>确认修改这张封面的信息？</p>
        <div class="sheet-confirm__actions">
          <button type="button" id="sheet-confirm-cancel" class="sheet-confirm__cancel">取消</button>
          <button type="button" id="sheet-confirm-ok" class="sheet-confirm__ok">确认</button>
        </div>
      </div>
    </div>
  </div>
  <div id="cat-sheet" class="cat-sheet" hidden>
    <button type="button" id="cat-sheet-backdrop" class="cat-sheet__backdrop" aria-label="取消"></button>
    <div class="cat-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="cat-sheet-title">
      <h2 id="cat-sheet-title" class="cat-sheet__title">新分类</h2>
      <input id="cat-sheet-input" class="cat-sheet__input" type="text" maxlength="20" placeholder="分类名" autocomplete="off" />
      <p id="cat-sheet-msg" class="cat-sheet__msg"></p>
      <div class="cat-sheet__btns">
        <button type="button" id="cat-sheet-cancel" class="cat-sheet__cancel">取消</button>
        <button type="button" id="cat-sheet-ok" class="cat-sheet__ok">创建</button>
      </div>
    </div>
  </div>
  <div id="app-toast" class="app-toast" hidden aria-live="polite"></div>
  <div id="type-sheet" class="cat-sheet" hidden>
    <button type="button" id="type-sheet-backdrop" class="cat-sheet__backdrop" aria-label="关闭"></button>
    <div class="cat-sheet__panel type-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="type-sheet-title">
      <h2 id="type-sheet-title" class="cat-sheet__title">管理类型</h2>
      <p class="type-sheet__hint">默认与自建均可删除 · 只删类型不删封面</p>
      <div id="type-sheet-list" class="type-sheet__list"></div>
      <div class="cat-sheet__btns">
        <button type="button" id="type-sheet-close" class="cat-sheet__ok type-sheet__done">完成</button>
      </div>
    </div>
  </div>
  <div id="ask" class="sheet-confirm ask" hidden>
    <button type="button" id="ask-backdrop" class="sheet-confirm__backdrop" aria-label="取消"></button>
    <div class="sheet-confirm__box" role="dialog" aria-modal="true">
      <p id="ask-text"></p>
      <p id="ask-sub" class="ask-sub" hidden></p>
      <div class="sheet-confirm__actions">
        <button type="button" id="ask-cancel" class="sheet-confirm__cancel">取消</button>
        <button type="button" id="ask-ok" class="sheet-confirm__ok">确认</button>
      </div>
    </div>
  </div>
  <svg class="pp-plane" id="pp-plane" viewBox="0 0 64 40" aria-hidden="true">
    <polygon points="2,6 62,20 14,20" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <polygon points="2,34 62,20 14,20" fill="#efefef" stroke="#d8d8d8" stroke-width="1"/>
    <polygon points="14,20 22,24 18,30" fill="#dcdcdc"/>
  </svg>
  <div class="pp-toast" id="pp-toast" role="status">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 3.5h12a.5.5 0 0 1 .5.5v16.2a.4.4 0 0 1-.63.33L12 16.4l-5.87 4.13A.4.4 0 0 1 5.5 20.2V4a.5.5 0 0 1 .5-.5Z"/>
    </svg>
    已收入灵感库
  </div>
  <script src="./app.js?v=20261107d"></script>
</body>
</html>
